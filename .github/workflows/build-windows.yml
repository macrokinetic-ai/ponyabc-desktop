name: Build Windows EXE + Store package

on:
  push:
    branches: [main]
    tags: ['v*']
    # Builds run on every v* tag, but only a -rc tag may ATTACH to a Release (see the
    # attach steps). A plain vX.Y.Z page holds the exact bytes sent to the Store.
  workflow_dispatch:
    inputs:
      rc:
        description: 'Release candidate to stamp into the .exe, e.g. rc2. Leave empty for an unstamped build; the Store package is never stamped.'
        required: false
        default: ''

permissions:
  contents: write # only needed to attach the installer to a GitHub Release on a tag push

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The parent manual's pictures. Here because the firmware wizard renders on Windows only
      # — on macOS that screen is a single "this needs Windows" banner — and this is the
      # repo's Windows job. Nothing here touches a device: the app is pointed at a throwaway
      # pen folder (scripts/make-demo-pen.mjs), and the firmware steps use the demo path in
      # src/main/services/demoFirmware.ts, which launches nothing and refuses to run at all in
      # a packaged build. Runs against the dev build, before packaging, so the artifact is
      # ready early.
      - name: "Manual: capture every parent-facing screen, both languages"
        # Documentation, not a build gate: a screen that will not pose must never stop a
        # release build. What was and was not captured is in capture-report.json.
        continue-on-error: true
        run: |
          npm run build
          node scripts/capture-manual-screenshots.mjs manual-screenshots --locales=en,zh-Hant
          Get-Content manual-screenshots/capture-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-screenshots
          path: manual-screenshots
          if-no-files-found: error
          retention-days: 14

      # Which candidate this build is. A tag decides it — v0.3.17-rc2 means rc2 — because a tag
      # build re-uploads the installer over the release's existing one, and taking the answer
      # from a dispatch input would silently replace a stamped .exe with an unstamped one.
      # That happened once; this is why it cannot happen again.
      - name: Work out the release candidate
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/*-rc* ]]; then
            echo "value=${GITHUB_REF_NAME##*-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.rc }}" >> "$GITHUB_OUTPUT"
          fi

      # PONYABC_BUILD_TAG/COMMIT are stamped into THIS build only. The Store package below is
      # built by a separate command without them, so it shows a plain version number — see
      # formatBuildLabel in src/shared/appVariant.ts. That package build must not rebuild this
      # installer: `pack:win:appx` is pinned to `--win appx` because `--win` alone also rebuilt
      # the NSIS .exe, from an unstamped bundle, on top of the stamped one already sitting in
      # release/ (and refreshed its checksum to match). rc4 shipped that way. See the stamp
      # check on the finished installers further down, which is what now catches it.
      # Read the bytes that would ship, and refuse if anything internal is in them.
      - name: "Store build: prove it contains no developer path"
        run: |
          npm run build:store
          node scripts/check-store-build.mjs

      - name: "Store build: installer + Store package"
        run: npm run dist:win
        env:
          PONYABC_INTERNAL: '0'
          PONYABC_BUILD_TAG: ${{ steps.rc.outputs.value }}
          PONYABC_BUILD_COMMIT: ${{ github.sha }}

      # The stamp is invisible from outside the installer, so it is checked where it is still
      # readable: the unpacked app's own main bundle. `strings` on the finished .exe proves
      # nothing — compressed bytes match anything — and a build that quietly lost its stamp is
      # a build a tester cannot identify.
      - name: "Installer: check the build stamped itself"
        shell: pwsh
        run: |
          $rc = '${{ steps.rc.outputs.value }}'
          $main = 'release/win-unpacked/resources/app.asar'
          if (-not (Test-Path $main)) { throw "no unpacked app at $main" }
          $stamped = Select-String -Path $main -Pattern "$($env:GITHUB_SHA.Substring(0,7))" -Encoding utf8 -Quiet
          if ($rc -eq '') {
            Write-Host "No candidate for this build; nothing to stamp."
          } elseif (-not $stamped) {
            throw "This build should carry the stamp $rc / $($env:GITHUB_SHA.Substring(0,7)), and does not."
          } else {
            Write-Host "Stamped $rc / $($env:GITHUB_SHA.Substring(0,7))."
          }

      # Copied INTO release/ rather than listed from store-assets/ in the upload below:
      # upload-artifact roots the zip at the least common ancestor of its paths, so mixing the
      # two directories would have given the tester a zip of nested folders to dig through
      # instead of the three files side by side.
      - name: "Installer: put the tester's README next to the .exe"
        run: Copy-Item store-assets/windows-installer-kit/READ-ME-FIRST.txt release/

      # The INTERNAL build: same code, plus testing mode and the support tools. A different
      # product to Windows, so it installs beside the Store app instead of replacing it.
      - name: "Internal build: installer"
        run: npm run dist:win:internal
        env:
          PONYABC_BUILD_TAG: ${{ steps.rc.outputs.value }}
          PONYABC_BUILD_COMMIT: ${{ github.sha }}

      # Both installers exist and are freshly built at this point: the Store one was stamp-checked
      # when it was made, and release/win-unpacked now holds the Internal one, so its stamp can be
      # read the same way. Recording both hashes here is what lets the step further down prove
      # that the files finally published are these ones and not something rebuilt over them.
      - name: "Installers: check the internal stamp, and record both files"
        shell: pwsh
        run: |
          $rc = '${{ steps.rc.outputs.value }}'
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $asar = 'release/win-unpacked/resources/app.asar'
          if (-not (Test-Path $asar)) { throw "no unpacked internal app at $asar" }
          if ($rc -eq '') {
            Write-Host 'No candidate for this build; nothing to stamp.'
          } elseif (-not (Select-String -Path $asar -Pattern $short -Encoding utf8 -Quiet)) {
            throw "The internal build should carry the stamp $rc / $short, and does not."
          } else {
            Write-Host "Internal build stamped $rc / $short."
          }

          $exes = @(Get-ChildItem 'release/*.exe' | Where-Object { $_.Name -notlike '*uninstaller*' })
          if ($exes.Count -ne 2) {
            throw "expected 2 installers in release/, found $($exes.Count): $($exes.Name -join ', ')"
          }
          $hashes = [ordered]@{}
          foreach ($exe in $exes) {
            $hashes[$exe.Name] = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host "$($exe.Name)  $($hashes[$exe.Name])"
          }
          # RUNNER_TEMP, not release/ — release/ is what gets uploaded, and this is scaffolding.
          $hashes | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'installer-hashes.json')

      # An internal package carrying the Store identity could be submitted by mistake, and
      # would replace the customers' app on any machine that installed it. Refuse to go on.
      - name: "Internal: prove this is not the Store identity"
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/PonyABC-Desktop-Internal-*.exe | Select-Object -First 1
          if (-not $exe) { throw "no internal installer was produced" }
          Write-Host "internal installer: $($exe.Name)"
          $asar = 'release/win-unpacked/resources/app.asar'
          if (Select-String -Path $asar -Pattern 'uk\.ponyabc\.desktop"' -Quiet) {
            throw "the internal package carries the Store application id"
          }
          if (-not (Select-String -Path $asar -Pattern 'INTERNAL TEST BUILD' -Quiet)) {
            throw "the internal build has no internal banner — it is not the internal build"
          }
          Write-Host "Internal identity confirmed, and it says so on screen."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-internal
          path: |
            release/PonyABC-Desktop-Internal-*.exe
            release/PonyABC-Desktop-Internal-*.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # dist:win's postscript (scripts/checksum.mjs) writes a matching .sha256 sidecar —
          # ship it alongside the installer so a downloaded artifact can be verified too.
          # READ-ME-FIRST.txt rides along because the person who downloads this is usually a
          # tester, not a developer: it names the file to double-click, says what the
          # "Windows protected your PC" box is and which two words to click, and explains how
          # to put the Store version back afterwards.
          path: |
            release/*.exe
            release/*.sha256
            release/READ-ME-FIRST.txt
          if-no-files-found: error

      # When this run was triggered by pushing a version tag (i.e. a release tag such as
      # v0.2.5), attach the installer + its checksum straight to that GitHub Release so
      # they land next to the Mac .dmg builds on the same release page — not just as a
      # build artifact that requires a GitHub login to download.
      - name: Attach installer to the matching GitHub Release (skips if none exists)
        # TEST TAGS ONLY (-rc). A plain vX.Y.Z release page is the permanent record of what
        # went to the Microsoft Store: hand-assembled, byte-checked, and never to be written
        # to by a build. This was a denylist naming 'store-candidate' — the one tag that had
        # already been damaged, where a build clobbered the unsigned submitted .appx with a
        # test-signed one. v0.3.17 was not on that list, so tagging the published version
        # would have overwritten the exact bytes Microsoft certified. An allowlist cannot
        # have that hole: a build attaches to a release candidate, or to nothing.
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
        shell: bash
        run: |
          set -euo pipefail
          # This repo is PRIVATE and does not publish GitHub Releases: distribution is the
          # Microsoft Store, and a public download path is a separate, deliberate decision
          # (see the upcoming Mac task). Tags are pushed for PROVENANCE — to pin the exact
          # commit a Store package was built from — not to cut a Release.
          #
          # So a missing Release is the normal case, not a failure. This step used to run
          # `gh release upload` unconditionally, which made the whole tag build red at its
          # last step even though the build and every package check had passed (v0.3.16,
          # run 36501587394). It never creates a Release: that would publish binaries as a
          # side effect of tagging, which nobody asked for.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists — attaching installer."
            gh release upload "${GITHUB_REF_NAME}" release/*.exe release/*.sha256 \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            echo "::notice::No GitHub Release '${GITHUB_REF_NAME}' exists — skipping installer upload. The tag is for provenance; artifacts remain downloadable from this run. Not creating a Release."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================================================
      # Microsoft Store package — a SEPARATE artifact from the NSIS .exe above. None of the steps
      # above are touched; this only adds a second Windows distribution path. Split into clearly
      # separate steps on purpose: packaging, installation, launch, and a functional probe are
      # different questions and a failure in one must not be misread as proof about the others.
      # ============================================================================================

      # --- 1. PACKAGING ---------------------------------------------------------------------
      - name: "Store package: generate ephemeral test cert + build (.appx)"
        shell: pwsh
        run: |
          # Store submissions themselves need no CA-trusted certificate (Microsoft re-signs on
          # ingestion — see electron-builder.win-appx.yml's comments), but electron-builder still
          # needs SOME certificate whose Subject exactly matches the required Partner Center
          # `publisher` value to produce a validly-signed package at all. This cert exists only
          # for this CI job (never a secret, never committed, never reused) so the steps below can
          # actually install and run the package to verify it — not just that packaging exited 0.
          $certSubject = 'CN=E476FCF5-1C63-4A56-85B1-DA5D642911B5'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $certSubject `
            -KeyUsage DigitalSignature -FriendlyName 'PonyABC Desktop CI sideload-test cert (ephemeral)' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')

          $pfxPath = Join-Path $env:RUNNER_TEMP 'ponyabc-appx-test-cert.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'ponyabc-appx-test-cert.cer'
          $certPassword = [System.Guid]::NewGuid().ToString()
          $securePassword = ConvertTo-SecureString -String $certPassword -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          # electron-builder bundles its own signtool.exe (winCodeSign vendor package), which as
          # of this runner image fails with "SignTool Error: A required function is not present."
          # — a known incompatibility between that vendored binary and the current windows-latest
          # image (confirmed by a real failed run, not assumed). Fix: point electron-builder at
          # the real Windows SDK signtool.exe already on this runner (via Visual Studio Build
          # Tools) using its own documented SIGNTOOL_PATH override
          # (app-builder-lib/out/codeSign/windowsSignToolManager.js reads this env var first,
          # before falling back to the vendored binary).
          $sdkSigntool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $sdkSigntool) { throw 'Could not find a Windows SDK signtool.exe on this runner (expected under C:\Program Files (x86)\Windows Kits\10\bin\*\x64\).' }
          Write-Host "Using Windows SDK signtool.exe: $($sdkSigntool.FullName)"

          # electron-builder's Windows signing reads these env vars (scoped to this step only —
          # never written to $GITHUB_ENV, so they don't leak into later steps/jobs).
          $env:CSC_LINK = $pfxPath
          $env:CSC_KEY_PASSWORD = $certPassword
          $env:SIGNTOOL_PATH = $sdkSigntool.FullName
          npm run dist:win:appx
          if ($LASTEXITCODE -ne 0) { throw "npm run dist:win:appx failed with exit code $LASTEXITCODE" }

          # Deliberately NOT importing/trusting the cert here — that's now 1-install.ps1's job
          # (further down this job), and doing it here first would always make its "already
          # trusted?" check report true, masking the real not-yet-trusted scenario a fresh tester
          # machine actually has. Found by a real CI run — this cert stays untrusted until
          # 1-install.ps1 itself decides whether to import it.

          # Publish the PUBLIC certificate (never the .pfx/private key) alongside the package so
          # someone downloading this run's artifact — not building it themselves — has a matching
          # cert to sideload-trust it with. This cert is single-use/ephemeral: a fresh one is
          # generated every run, tied only to this specific build's .appx.
          Copy-Item -Path $cerPath -Destination (Join-Path 'release' 'PonyABC-Desktop-test-cert.cer')

          $appx = Get-ChildItem -Path 'release' -Filter '*.appx' | Select-Object -First 1
          if (-not $appx) { throw 'PACKAGING FAILED: no .appx file found in release/ after dist:win:appx.' }
          Write-Host "PACKAGING OK: $($appx.Name) ($([math]::Round($appx.Length / 1MB, 2)) MB)"

      # --- 1b. Bundle the tester-facing kit alongside the package, and validate the scripts for --
      #         real before anyone downloads them — not just eyeballed. ---------------------------
      - name: "Store package: bundle and syntax-check the Windows test kit"
        shell: pwsh
        run: |
          Copy-Item -Path 'store-assets\windows-test-kit\*.ps1', 'store-assets\windows-test-kit\README.md' -Destination 'release\'

          $hadErrors = $false
          foreach ($script in Get-ChildItem -Path 'release' -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $hadErrors = $true
              Write-Host "::error::Syntax errors in $($script.Name):"
              $errors | ForEach-Object { Write-Host "::error::  $_" }
            } else {
              Write-Host "Syntax OK: $($script.Name)"
            }
          }
          if ($hadErrors) { throw 'One or more test-kit scripts have real PowerShell syntax errors — see above. Not safe to hand to a tester.' }

      # --- 2. PACKAGING VERIFICATION: real manifest content, not an assumption ------------------
      - name: "Store package: inspect AppxManifest.xml and verify Partner Center identity"
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $appx = Get-ChildItem -Path 'release' -Filter '*.appx' | Select-Object -First 1
          if (-not $appx) { throw 'No .appx file found in release/' }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
            if (-not $entry) { throw 'AppxManifest.xml was not found inside the .appx package — this is not a valid Appx/MSIX container.' }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $manifestXml = $reader.ReadToEnd()
            $reader.Close()
          } finally {
            $zip.Dispose()
          }

          Write-Host '----- Real AppxManifest.xml contents (from inside the built package, not a template) -----'
          Write-Host $manifestXml

          [xml]$manifest = $manifestXml
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace('a', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identityNode = $manifest.SelectSingleNode('//a:Identity', $ns)
          $propsNode = $manifest.SelectSingleNode('//a:Properties/a:PublisherDisplayName', $ns)

          $expected = @{
            IdentityName      = 'PonyABC.PonyABCDesktop'
            IdentityPublisher = 'CN=E476FCF5-1C63-4A56-85B1-DA5D642911B5'
            PublisherDisplay  = 'PonyABC'
          }
          $actual = @{
            IdentityName      = $identityNode.GetAttribute('Name')
            IdentityPublisher = $identityNode.GetAttribute('Publisher')
            PublisherDisplay  = $propsNode.InnerText
          }

          $mismatches = @()
          foreach ($key in $expected.Keys) {
            if ($actual[$key] -ne $expected[$key]) {
              $mismatches += "  $key`: expected '$($expected[$key])', got '$($actual[$key])'"
            }
          }
          if ($mismatches.Count -gt 0) {
            $mismatches | ForEach-Object { Write-Host "::error::$_" }
            throw 'IDENTITY VERIFICATION FAILED — the built package does NOT carry the required Partner Center identity. See mismatches above.'
          }
          Write-Host "IDENTITY VERIFIED: Name='$($actual.IdentityName)' Publisher='$($actual.IdentityPublisher)' PublisherDisplayName='$($actual.PublisherDisplay)' — all match Partner Center exactly."

      # --- 2b. TILE ASSET VERIFICATION (Store cert 10.1.1.11): every image the manifest ---------
      #         references must exist in the package, and none may be electron-builder's -------
      #         default sample art (identified by the SHA-256 of the v0.3.15 defaults). ---------
      - name: "Store package: verify tile/logo assets are not the default Electron art"
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName System.Drawing
          $appx = Get-ChildItem -Path 'release' -Filter '*.appx' | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'appx-assets-check'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($appx.FullName, $extract)

          [xml]$m = Get-Content (Join-Path $extract 'AppxManifest.xml') -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($m.NameTable)
          $ns.AddNamespace('a', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $ns.AddNamespace('uap', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')
          $ve = $m.SelectSingleNode('//uap:VisualElements', $ns)
          $refs = @($m.SelectSingleNode('//a:Properties/a:Logo', $ns).InnerText, $ve.GetAttribute('Square150x150Logo'), $ve.GetAttribute('Square44x44Logo'))
          $tile = $m.SelectSingleNode('//uap:DefaultTile', $ns)
          foreach ($attr in 'Wide310x150Logo', 'Square310x310Logo', 'Square71x71Logo') { $v = $tile.GetAttribute($attr); if ($v) { $refs += $v } }
          Write-Host "Manifest references: $($refs -join ', ')"

          # SHA-256 of electron-builder's bundled sample assets — the exact files the rejected
          # v0.3.15 package shipped (extracted from that submitted .appx).
          $defaultHashes = @{
            'B6D709BA362DF5EB3FD7BB11616ECAEDE1A8C6228B366D06E8B1DA0DD3E63BDA' = 'SampleAppx.150x150.png'
            '8BAC33B74A3C76F3E8EB04DE0F0BDB56C439398CCDC9C61811A12C62AC059327' = 'SampleAppx.44x44.png'
            'EBDA946CECC7A2B3569BE328AB4B785091A2C7C48A28BB719E97AF22575AEB35' = 'SampleAppx.50x50.png'
            'F93FBE8780CFE89A7AA8065D71765FDA49B48718E4AAE17BBB0E99DA4BAEDB23' = 'SampleAppx.310x150.png'
          }

          $problems = @()
          $pkgAssets = Get-ChildItem (Join-Path $extract 'Assets') -Filter '*.png'
          if (-not (Test-Path (Join-Path $extract 'resources.pri'))) { $problems += 'resources.pri missing (scaled assets not indexed)' }
          foreach ($f in $pkgAssets) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            if ($defaultHashes.ContainsKey($h)) { $problems += "$($f.Name) is electron-builder default art ($($defaultHashes[$h]))" }
            $img = [System.Drawing.Image]::FromFile($f.FullName)
            Write-Host ("  {0,-52} {1,5} x {2,-5}" -f $f.Name, $img.Width, $img.Height)
            $img.Dispose()
          }
          foreach ($r in $refs) {
            $base = [IO.Path]::GetFileNameWithoutExtension($r)
            $hit = $pkgAssets | Where-Object { $_.Name -like "$base.*png" -or $_.Name -eq "$base.png" }
            if (-not $hit) { $problems += "manifest references '$r' but no matching file is packaged" }
          }
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw 'TILE ASSET VERIFICATION FAILED — see above.'
          }
          Write-Host "TILE ASSETS VERIFIED: $($pkgAssets.Count) packaged images, none default art, all manifest references resolve."

      - name: "Store package: verify version, checksum sidecar and EXE icon"
        shell: pwsh
        run: |
          # Checks that were missing and each of which has already cost a real
          # submission or near-miss:
          #   1. manifest Identity/Version must equal package.json version + '.0'.
          #      electron-builder derives it, so a mismatch means the build did not
          #      pick up the bump and you would resubmit the SAME version.
          #   2. the built version must be strictly GREATER than what is already live
          #      in the Store. main once sat at 0.3.15 while 0.3.16.0 was published;
          #      Partner Center rejects a version that is not higher.
          #   3. the .sha256 sidecar must actually match the .appx it sits next to.
          #   4. the packaged EXE must not carry default Electron artwork — the APPX
          #      tiles and the EXE icon are separate assets and 10.1.1.11 was caused
          #      by fixing one and not the other.
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $problems = @()
          $appx = Get-ChildItem -Path 'release' -Filter '*.appx' | Select-Object -First 1
          if (-not $appx) { throw 'No .appx file found in release/' }

          # --- 1. manifest version vs package.json ---------------------------------
          $pkgVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $expectedManifestVersion = "$pkgVersion.0"

          $extract = Join-Path $env:RUNNER_TEMP 'appx-version-check'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($appx.FullName, $extract)
          [xml]$m = Get-Content (Join-Path $extract 'AppxManifest.xml') -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($m.NameTable)
          $ns.AddNamespace('a', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $actualManifestVersion = $m.SelectSingleNode('//a:Identity', $ns).GetAttribute('Version')

          Write-Host "package.json version      : $pkgVersion"
          Write-Host "manifest Identity/Version : $actualManifestVersion (expected $expectedManifestVersion)"
          if ($actualManifestVersion -ne $expectedManifestVersion) {
            $problems += "manifest Identity/Version is '$actualManifestVersion' but package.json implies '$expectedManifestVersion' — the build did not pick up the version bump"
          }

          # --- 2. must be higher than what is already published --------------------
          $publishedFile = 'store-assets/PUBLISHED-STORE-VERSION'
          if (Test-Path $publishedFile) {
            $published = (Get-Content $publishedFile -Raw).Trim()
            Write-Host "already live in the Store  : $published"
            if ([version]$actualManifestVersion -le [version]$published) {
              $problems += "built version $actualManifestVersion is NOT higher than the published $published — Partner Center will reject this package"
            }
          } else {
            Write-Host "::warning::$publishedFile is missing — cannot check the version actually increases"
          }

          # --- 3. checksum sidecar matches the package -----------------------------
          $sidecar = "$($appx.FullName).sha256"
          if (-not (Test-Path $sidecar)) {
            $problems += "checksum sidecar $([IO.Path]::GetFileName($sidecar)) is missing"
          } else {
            $recorded = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash $appx.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "appx sha256 (recomputed)  : $actual"
            Write-Host "appx sha256 (sidecar)     : $($recorded.ToLower())"
            if ($recorded.ToLower() -ne $actual) {
              $problems += "sidecar checksum does not match the .appx — the sidecar is stale"
            }
          }

          # --- 4. EXE icon is the real PonyABC icon --------------------------------
          # A POSITIVE assertion against the known-good icon, not a blacklist of
          # electron's default: nobody has a trustworthy hash for every default
          # electron-builder ships, and a blacklist silently passes anything new.
          # If the icon is intentionally changed, update the .expected file in the
          # same commit — that makes the change explicit and reviewable.
          $ico = 'build/icon.ico'
          $icoExpectedFile = 'build/icon.ico.sha256.expected'
          if (-not (Test-Path $ico)) {
            $problems += "$ico is missing — the EXE would fall back to default Electron artwork"
          } elseif (-not (Test-Path $icoExpectedFile)) {
            $problems += "$icoExpectedFile is missing — cannot prove the EXE icon is the PonyABC one"
          } else {
            $icoHash = (Get-FileHash $ico -Algorithm SHA256).Hash.ToUpper()
            $icoExpected = (Get-Content $icoExpectedFile -Raw).Trim().ToUpper()
            Write-Host "build/icon.ico sha256     : $icoHash"
            Write-Host "build/icon.ico expected   : $icoExpected"
            if ($icoHash -ne $icoExpected) {
              $problems += "build/icon.ico does not match the recorded PonyABC icon. If this change is intended, update $icoExpectedFile in the same commit."
            }
            if ((Get-Item $ico).Length -lt 20000) {
              $problems += "build/icon.ico is only $((Get-Item $ico).Length) bytes — too small to hold the 16-256px sizes this app ships"
            }
          }

          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw 'VERSION / CHECKSUM / ICON VERIFICATION FAILED — see above.'
          }
          Write-Host "VERIFIED: version $actualManifestVersion is correct and higher than the published release, sidecar matches, EXE icon is custom."

      # --- 3. INSTALLATION — runs the ACTUAL delivered 1-install.ps1, not a parallel CI-only ------
      #        reimplementation, so a passing CI run is real evidence the tester's own script ----
      #        works, not just that installation is possible in general. --------------------------
      - name: "Store package: run the real 1-install.ps1 (same script the tester gets)"
        shell: pwsh
        run: |
          # 1-install.ps1 deliberately Set-Location's into its own folder (harmless/a no-op for a
          # real tester, who has already cd'd there per the README before running it) — but
          # PowerShell's current directory is process-wide, not scoped to the called script, so
          # without Push-Location/Pop-Location that change would leak into every relative path
          # below and silently point them at the wrong place (confirmed by a real CI run: the
          # script's own log showed it wrote test-kit-state.json successfully, while this
          # wrapper's own Test-Path for the same file, one line later, reported it missing).
          Push-Location 'release'
          try {
            & '.\1-install.ps1'
            if ($LASTEXITCODE -ne 0) { throw "1-install.ps1 exited with code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          if (-not (Test-Path 'release\test-kit-state.json')) { throw '1-install.ps1 did not write test-kit-state.json.' }
          $state = Get-Content 'release\test-kit-state.json' -Raw | ConvertFrom-Json
          Write-Host "State file contents: $($state | ConvertTo-Json -Compress)"
          if (-not $state.certImportedByUs) {
            throw "Expected certImportedByUs=true on a clean runner (no prior trust for this run's fresh cert) — got false. The thumbprint-tracking logic may be broken."
          }
          if ($state.packageFamilyName -ne 'PonyABC.PonyABCDesktop_f1jemggxjsyxg') {
            throw "State file's recorded PackageFamilyName '$($state.packageFamilyName)' does not match the Partner Center-registered value."
          }
          Write-Host "1-install.ps1 verified end-to-end: checksum, certificate thumbprint tracking, install, and identity all correct."

      # --- 4. LAUNCH ------------------------------------------------------------------------------
      - name: "Store package: verify the installed app actually launches"
        shell: pwsh
        run: |
          $installed = Get-AppxPackage -Name 'PonyABC.PonyABCDesktop'
          # NOT `Get-ChildItem -Filter '*.exe'` — a real run showed it finds nothing under
          # InstallLocation (WindowsApps' restrictive ACLs block a plain, non-`-Force` directory
          # listing even for an admin). Read the executable's real relative path straight out of
          # the installed AppxManifest.xml instead — the same source of truth Windows itself uses
          # to launch the app, not a filesystem guess.
          [xml]$installedManifest = Get-Content -Path (Join-Path $installed.InstallLocation 'AppxManifest.xml') -Raw
          $ns2 = New-Object System.Xml.XmlNamespaceManager($installedManifest.NameTable)
          $ns2.AddNamespace('a', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $exeRelPath = $installedManifest.SelectSingleNode('//a:Application', $ns2).GetAttribute('Executable')
          $exePath = Join-Path $installed.InstallLocation $exeRelPath
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) { throw "LAUNCH FAILED: manifest names executable '$exeRelPath' but no such file exists at '$exePath'." }
          Write-Host "Resolved real executable from the installed manifest: $exePath"

          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 8
          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $running) {
            throw "LAUNCH FAILED: process (PID $($proc.Id)) launched from the installed package is not running 8s later — it exited immediately or crashed on startup."
          }
          Write-Host "LAUNCH OK: '$($running.ProcessName)' (PID $($proc.Id)) is running from the installed MSIX package."
          & taskkill /F /T /PID $proc.Id 2>$null | Out-Null

      # --- 4b. REAL WINDOWS SCREENSHOTS: genuine native captures for the Store listing, replacing
      #         the macOS-dev-build placeholders for Firmware/Settings (and refreshing the rest
      #         with real Windows chrome) — same platform-agnostic CDP tool used for the mac
      #         captures, no separate implementation to maintain. ------------------------------------
      - name: "Store package: capture real screenshots from the installed package"
        shell: pwsh
        run: |
          $installed = Get-AppxPackage -Name 'PonyABC.PonyABCDesktop'
          [xml]$installedManifest = Get-Content -Path (Join-Path $installed.InstallLocation 'AppxManifest.xml') -Raw
          $ns4 = New-Object System.Xml.XmlNamespaceManager($installedManifest.NameTable)
          $ns4.AddNamespace('a', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $exeRelPath = $installedManifest.SelectSingleNode('//a:Application', $ns4).GetAttribute('Executable')
          $exePath = Join-Path $installed.InstallLocation $exeRelPath
          New-Item -ItemType Directory -Force -Path 'release\screenshots' | Out-Null
          node scripts/capture-screenshots.mjs $exePath 'release\screenshots' --label=winx64-msix
          if ($LASTEXITCODE -ne 0) { throw "capture-screenshots.mjs failed with exit code $LASTEXITCODE" }
          Get-ChildItem 'release\screenshots' | ForEach-Object { Write-Host "Captured: $($_.Name) ($([math]::Round($_.Length / 1KB)) KB)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: release/screenshots/*.png
          if-no-files-found: error

      # --- 5. (WAS: a firmware-plumbing probe against the installed Store package.) -----------
      #
      # It cannot run here any more, and that is the intended consequence of a decision rather
      # than something broken: the probe was switched on by an environment variable, and the
      # Store build now contains no environment switches at all (owner, 2026-09-30). Run
      # 36742931878 is the proof — the step launched the app, waited its full 150s, killed it
      # and produced no result, because nothing in the package was listening for the switch.
      #
      # What it asked — does the firmware plumbing work inside a real MSIX package — depended on
      # a UAC consent prompt that no non-interactive CI session can ever click, so it is now
      # asked on a real machine instead: docs/test-plans/internal-testing.md, check D. The
      # Internal build still carries the probe for anyone running it locally.

      # --- 6. CLEANUP — runs the ACTUAL delivered 3-cleanup.ps1, validating its thumbprint-scoped
      #        removal logic for real (this run's cert should show certImportedByUs=true and get
      #        removed; a pre-existing cert never would). -------------------------------------------
      # The earlier stamp check reads release/win-unpacked, which is scratch space: every later
      # packaging command rewrites it, and one of them used to rewrite the installer too. This
      # one opens the finished .exe files themselves — the exact bytes about to become Release
      # assets — and reads the stamp back out of the app.asar inside each. A tester who cannot
      # tell a candidate from the Store version by looking at Settings has no way to report a
      # bug against the right build, so an unstamped candidate is a failed build, not a warning.
      # The stamp checks above read release/win-unpacked, which is scratch space that every
      # later packaging command rewrites — and one of them used to rewrite the installers too,
      # which is how rc4 shipped unstamped with every step green. Opening the finished .exe
      # files here to re-read the stamp was the obvious answer and does not work: 7-Zip on the
      # runner cannot parse an NSIS installer.
      #
      # So this asks the stronger question instead, and asks it of the bytes: are the files
      # about to be published still the files that were checked? A rebuild cannot change the
      # contents without changing the hash.
      - name: "Installers: prove nothing rebuilt them after they were checked"
        if: steps.rc.outputs.value != ''
        shell: pwsh
        run: |
          $recorded = Join-Path $env:RUNNER_TEMP 'installer-hashes.json'
          if (-not (Test-Path $recorded)) { throw "no recorded installer hashes — the recording step did not run" }
          $before = Get-Content $recorded -Raw | ConvertFrom-Json
          foreach ($name in $before.PSObject.Properties.Name) {
            $path = "release/$name"
            if (-not (Test-Path $path)) { throw "$name was built and checked, and is no longer in release/" }
            $now = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($now -ne $before.$name) {
              throw "$name changed after it was checked: was $($before.$name), now $now. Something rebuilt it, and whatever it now contains has not been checked — rc4 shipped this way, with a Settings screen showing a plain version number."
            }
            Write-Host "$name unchanged since it was checked ($now)."
          }

      # Everything this version is, in one place. The owner's rule (2026-09-30) is that no
      # record of a version may live only on the Mac mini, so a dispatched candidate build
      # publishes the installer, the Store package, both checksums, the tester's README, the
      # four manual PDFs and the Store text as Release assets. Binaries are assets, never
      # git history.
      - name: "Release: publish this candidate with all of its records"
        if: github.event_name == 'workflow_dispatch' && inputs.rc != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-${{ inputs.rc }}"
          COMMIT="${GITHUB_SHA:0:7}"

          sed -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{RC}}/${{ inputs.rc }}/g" \
              -e "s/{{COMMIT}}/${COMMIT}/g" \
              -e "s/{{RUN}}/${GITHUB_RUN_ID}/g" \
              store-assets/rc-release-notes.md > /tmp/notes.md

          # Both builds, each with its checksum, plus everything that says what this version is.
          ASSETS=(release/*.exe release/*.exe.sha256 release/*.appx release/*.appx.sha256
                  release/READ-ME-FIRST.txt docs/manual/pdf/*.pdf
                  store-assets/whats-new-${VERSION}.md store-assets/store-listing-${VERSION}.md)
          for f in "${ASSETS[@]}"; do
            [ -e "$f" ] || { echo "missing asset: $f"; exit 1; }
          done

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md \
              --prerelease --latest=false
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG — test build" --notes-file /tmp/notes.md \
              --prerelease --latest=false "${ASSETS[@]}"
          fi
          echo "Published $TAG with ${#ASSETS[@]} assets."

      - name: "Store package: run the real 3-cleanup.ps1 (same script the tester gets)"
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'release\3-cleanup.ps1')) {
            Write-Host '3-cleanup.ps1 not present (an earlier step likely failed before bundling) — falling back to a plain uninstall.'
            $installed = Get-AppxPackage -Name 'PonyABC.PonyABCDesktop' -ErrorAction SilentlyContinue
            if ($installed) { Remove-AppxPackage -Package $installed.PackageFullName }
            exit 0
          }
          $thumbprintBefore = if (Test-Path 'release\test-kit-state.json') { (Get-Content 'release\test-kit-state.json' -Raw | ConvertFrom-Json).certThumbprint } else { $null }

          & '.\release\3-cleanup.ps1'
          if ($LASTEXITCODE -ne 0) { throw "3-cleanup.ps1 exited with code $LASTEXITCODE" }

          if (Get-AppxPackage -Name 'PonyABC.PonyABCDesktop' -ErrorAction SilentlyContinue) {
            throw '3-cleanup.ps1 ran but the package is still installed.'
          }
          if ($thumbprintBefore -and (Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' | Where-Object Thumbprint -eq $thumbprintBefore)) {
            throw "3-cleanup.ps1 ran but certificate thumbprint $thumbprintBefore (which this run imported) is still present."
          }
          Write-Host '3-cleanup.ps1 verified end-to-end: package uninstalled, and this run''s own certificate thumbprint removed.'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-appx
          # dist:win:appx's postscript (scripts/checksum.mjs) writes a matching .sha256 sidecar,
          # same convention as the NSIS .exe artifact above. Scoped to *.appx.sha256 specifically
          # (not the broader *.sha256) since by this point in the job release/ also contains the
          # .exe's own checksum from the earlier dist:win step. The .cer is the PUBLIC half of
          # this run's ephemeral test-signing cert (see the packaging step) — published so anyone
          # downloading this artifact (not building it themselves) has a matching cert to
          # sideload-trust it with. Never the .pfx/private key. The .ps1/.md files are the
          # tester-facing kit (store-assets/windows-test-kit/), bundled and syntax-checked earlier
          # in this job, and just exercised for real by steps 3 and 6 above using these EXACT
          # files (not a parallel copy) — test-kit-state.json is deliberately excluded (removed by
          # 3-cleanup.ps1 already; it's this CI run's own artifact, not something a tester needs).
          path: |
            release/*.appx
            release/*.appx.sha256
            release/*.cer
            release/*.ps1
            release/README.md
          if-no-files-found: error

      # Same rationale as the .exe's own release-upload step above: land the Store package next
      # to the .exe and .dmg installers on the tagged GitHub Release, not just as a login-gated
      # workflow artifact. This is a GitHub Release asset for LOCAL SIDELOAD TESTING only — a
      # test-certificate-signed package, never a normal customer installer, and NOT the Microsoft
      # Store listing itself, which is submitted separately via Partner Center.
      - name: Attach Store test package to the matching GitHub Release (skips if none exists)
        # TEST TAGS ONLY (-rc). A plain vX.Y.Z release page is the permanent record of what
        # went to the Microsoft Store: hand-assembled, byte-checked, and never to be written
        # to by a build. This was a denylist naming 'store-candidate' — the one tag that had
        # already been damaged, where a build clobbered the unsigned submitted .appx with a
        # test-signed one. v0.3.17 was not on that list, so tagging the published version
        # would have overwritten the exact bytes Microsoft certified. An allowlist cannot
        # have that hole: a build attaches to a release candidate, or to nothing.
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
        shell: bash
        run: |
          set -euo pipefail
          # Same reasoning as the installer step above: a missing Release is normal for this
          # private repo, and this step must not create one. The .appx, its .sha256 and the
          # ephemeral test .cer stay available as run artifacts either way.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists — attaching Store test package."
            gh release upload "${GITHUB_REF_NAME}" release/*.appx release/*.appx.sha256 release/*.cer \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            echo "::notice::No GitHub Release '${GITHUB_REF_NAME}' exists — skipping Store test package upload. Download it from this run's artifacts instead. Not creating a Release."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

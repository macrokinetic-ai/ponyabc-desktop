name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # only needed to attach the installer to a GitHub Release on a tag push

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

      # When this run was triggered by pushing a version tag (i.e. a release tag such as
      # v0.2.4), attach the installer straight to that GitHub Release so it lands next to
      # the Mac .dmg builds on the same release page — not just as a build artifact that
      # requires a GitHub login to download.
      - name: Attach installer to the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" release/*.exe --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

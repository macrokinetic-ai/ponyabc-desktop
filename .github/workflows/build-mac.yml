name: Build macOS DMGs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # only needed to attach installers to a GitHub Release on a tag push

jobs:
  build-mac:
    strategy:
      # arm64 failing must not cancel/hide the x64 job, and vice versa — each arch's
      # release-asset upload only ever runs against its own freshly-built glob, so a
      # failed arch simply produces zero uploads for that arch (never a stale substitute).
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:mac:${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-installer
          # pack:mac:*'s postscript (scripts/checksum.mjs) writes a matching .sha256
          # sidecar — ship it alongside the installer so a downloaded artifact can be
          # verified too.
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error

      # When this run was triggered by pushing a version tag (i.e. a release tag such as
      # v0.2.5), attach the installer + its checksum straight to that GitHub Release so
      # they land next to the Windows .exe build on the same release page — not just as
      # a build artifact that requires a GitHub login to download.
      - name: Attach installer to the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" release/*.dmg release/*.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

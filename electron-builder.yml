appId: uk.ponyabc.desktop
productName: PonyABC Desktop
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# electron-builder's own signing is skipped for mac.identity: null (no paid Apple Developer ID
# certificate exists yet), which means its "afterSign" hook never runs either — this applies a
# real ad-hoc signature to the packed .app anyway. No effect on win/linux. See scripts/afterPack.cjs.
afterPack: scripts/afterPack.cjs
mac:
  # No arch list here on purpose — each pack:mac:* npm script picks the arch via the
  # --arm64 / --x64 CLI flag instead. An explicit arch array on the target itself takes
  # precedence over those CLI flags (confirmed directly: with both present, electron-builder
  # built BOTH archs regardless of which flag was passed, colliding on the same artifactName).
  # The per-arch artifactName itself lives in electron-builder.mac-arm64.yml /
  # electron-builder.mac-x64.yml (each `extends` this file) — NOT passed via a CLI -c.mac.
  # artifactName=... override, because that string has to survive both the shell npm's
  # cross-platform script runner uses (cmd.exe on Windows, sh/bash on mac/Linux) AND
  # electron-builder's own ${version}/${ext} template syntax, and cmd.exe does not strip
  # single quotes the way bash does — confirmed directly: a single-quoted override produced
  # a real file literally named 'PonyABC-Desktop-v0.2.5-winx64.exe' (quote characters
  # included) when built on the actual windows-latest GitHub Actions runner. A plain YAML
  # value has no shell in the way at all, so this is not just a workaround, it's the
  # actually-correct place for this to live.
  target:
    - dmg
  category: public.app-category.education
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: PonyABC-Desktop-v${version}-winx64.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish: null
